<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budak Terpuji KP2027 - Mula</title>
    <!-- Three.js CDN Utam & Fallback CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: #080514; 
            min-height: 100vh; 
            width: 100vw;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 20px; 
            color: #fff; 
            overflow: hidden;
            position: relative;
        }

        /* 3D Canvas Background */
        #canvas-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .login-card { 
            position: relative;
            z-index: 10;
            background: rgba(15, 23, 42, 0.75); 
            backdrop-filter: blur(16px); 
            border: 2px solid rgba(56, 189, 248, 0.3); 
            border-radius: 24px; 
            padding: 40px; 
            width: 100%; 
            max-width: 480px; 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(56, 189, 248, 0.2); 
            text-align: center; 
        }

        .badge { display: inline-block; padding: 6px 16px; background: linear-gradient(90deg, #ec4899, #8b5cf6); border-radius: 20px; font-size: 0.8rem; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 15px; }
        h1 { font-size: 2.4rem; margin-bottom: 10px; background: linear-gradient(to right, #f472b6, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.subtitle { color: #94a3b8; font-size: 0.95rem; margin-bottom: 30px; }
        .form-group { margin-bottom: 24px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #cbd5e1; font-weight: 600; }
        input[type="text"] { width: 100%; padding: 14px 18px; border-radius: 12px; border: 2px solid rgba(255, 255, 255, 0.15); background: rgba(0, 0, 0, 0.4); color: #fff; font-size: 1rem; outline: none; transition: all 0.3s ease; }
        input[type="text"]:focus { border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
        .btn-submit { width: 100%; padding: 16px; border: none; border-radius: 12px; background: linear-gradient(90deg, #8b5cf6, #ec4899, #38bdf8); color: white; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3); margin-top: 10px; }
        .btn-submit:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 15px 25px rgba(236, 72, 153, 0.5); }
        .footer-note { margin-top: 25px; font-size: 0.8rem; color: #64748b; }
    </style>
</head>
<body>

    <!-- Canvas Latar 3D -->
    <div id="canvas-bg"></div>

    <div class="login-card">
        <span class="badge">KP2027 • TAHUN 1</span>
        <h1>Budak Terpuji</h1>
        <p class="subtitle">Daftarkan diri anda untuk memulakan perjalanan alam di sebalik mata</p>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="playerName">Nama Murid Terpuji:</label>
                <input type="text" id="playerName" placeholder="Masukkan nama anda..." required autocomplete="off">
            </div>
            <button type="submit" class="btn-submit">MULA PERJALANAN ➔</button>
        </form>
        <div class="footer-note">Kurikulum Persekolahan 2027 • Pembentukan Sahsiah Murid</div>
    </div>

    <script>
        // Check Ketersediaan THREE.js & WebGL
        if (typeof THREE === 'undefined') {
            console.warn("Three.js gagal dimuat naik dari CDN utama. Memuat naik skrip sokongan...");
            const script = document.createElement('script');
            script.src = "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js";
            script.onload = init3DBackground;
            document.head.appendChild(script);
        } else {
            init3DBackground();
        }

        // Penjanaan Visual 3D Latar Belakang
        function init3DBackground() {
            const container = document.getElementById('canvas-bg');
            if (!container) return;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Bintang-bintang 3D Bercahaya
            const starsGeo = new THREE.BufferGeometry();
            const count = 700;
            const positions = new Float32Array(count * 3);

            for (let i = 0; i < count * 3; i++) {
                positions[i] = (Math.random() - 0.5) * 15;
            }

            starsGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const starsMat = new THREE.PointsMaterial({ size: 0.04, color: 0x38bdf8, transparent: true, opacity: 0.8 });
            const starField = new THREE.Points(starsGeo, starsMat);
            scene.add(starField);

            // Ring Torus 3D Futuristik
            const torusGeo = new THREE.TorusGeometry(2, 0.05, 16, 100);
            const torusMat = new THREE.MeshBasicMaterial({ color: 0xec4899, wireframe: true });
            const torus = new THREE.Mesh(torusGeo, torusMat);
            scene.add(torus);

            function animate() {
                requestAnimationFrame(animate);
                starField.rotation.y += 0.001;
                torus.rotation.x += 0.005;
                torus.rotation.y += 0.008;
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function handleLogin(event) {
            event.preventDefault();
            const nameInput = document.getElementById('playerName').value.trim();
            if (nameInput) {
                localStorage.setItem('budakTerpuji_nama', nameInput);
                localStorage.setItem('budakTerpuji_chapDone', '0');
                localStorage.setItem('budakTerpuji_bonusClaimed', '0');
                
                // Terus mara ke fail pemilihan watak
                window.location.href = 'character-select.html';
            }
        }
    </script>
</body>
</html>
